vrf vrf100
 vni 100
 exit-vrf
!
interface lo
 ip address 10.255.1.4/32
!
interface t2d-eth0
 ip address 10.0.0.6/24
!
router bgp 65000
 bgp router-id 10.255.1.4
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as internal
 neighbor 10.0.0.1 send-community both
 neighbor 10.0.0.1 timers 1 3
 neighbor 10.0.0.1 timers connect 1
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
    neighbor 10.0.0.1 route-map evpn-export out
  advertise-all-vni
 exit-address-family
!
router bgp 65000 vrf vrf100
 bgp router-id 10.255.101.4
 no bgp network import-check
 !
 address-family ipv4 unicast
 exit-address-family
 !
 address-family l2vpn evpn
  rd 65000:130
  route-target both 65000:100
  advertise ipv4 unicast route-map evpn-export
 exit-address-family
!
route-map evpn-export permit 1000
