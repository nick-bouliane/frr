route-map evpn-export permit 10
 match ip address prefix-list scoped
 set community 65000:501
exit
route-map evpn-export permit 20
 match ip address prefix-list global
 set community 65000:501 65000:900
exit
route-map evpn-export permit 30
 match ip address prefix-list ignored
