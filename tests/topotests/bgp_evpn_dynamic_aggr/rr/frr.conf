interface lo
 ip address 10.255.0.1/32
!
interface rr-eth0
 ip address 10.0.0.1/24
!
ip route 10.255.0.2/32 10.0.0.2
!
router bgp 65000
 bgp router-id 10.255.0.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.0.0.2 remote-as internal
 neighbor 10.0.0.2 timers 1 3
 neighbor 10.0.0.2 timers connect 1
 neighbor 10.0.0.3 remote-as internal
 neighbor 10.0.0.3 timers 1 3
 neighbor 10.0.0.3 timers connect 1
 !
 address-family l2vpn evpn
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.2 route-reflector-client
  neighbor 10.0.0.3 activate
  neighbor 10.0.0.3 route-reflector-client
 exit-address-family
!
dynamic-aggr
 site-id 65000
 community-asn 65000
 rd-id-base 50000
 grid GRID-A community 501
 grid GRID-B community 502
 static-aggregate prefix 192.0.2.0/24 grid GRID-A vni 100
 dynamic-aggregate prefix 10.10.0.0/24 slice-prefixlen 26
 dynamic-aggregate prefix 10.40.0.0/24 slice-prefixlen 26
 dynamic-aggregate prefix 10.50.0.0/24 slice-prefixlen 26
 dynamic-aggregate prefix 10.60.0.0/24 slice-prefixlen 26
 dynamic-aggregate prefix 10.70.0.0/24 slice-prefixlen 26
 dynamic-aggregate prefix 10.80.0.0/24 slice-prefixlen 26
 dynamic-aggregate prefix 10.120.0.0/24 slice-prefixlen 28
 dynamic-aggregate global community 65000:900
 dynamic-aggregate global community 65000:901
!
