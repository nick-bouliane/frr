!
vrf vrf-50
 vni 50
 exit-vrf
!
vrf vrf-1001
 vni 1001
 exit-vrf
!
interface loop50 vrf vrf-50
 ip address 10.0.50.1/32
!
interface loop1001 vrf vrf-1001
 ip address 10.0.100.1/32
!
int lo
 ip address 10.10.10.2/32
!
int r2-eth0
 ip address 192.168.1.2/24
!
router bgp 65002
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 192.168.1.1 remote-as external
 neighbor 192.168.1.1 timers 1 3
 neighbor 192.168.1.1 timers connect 1
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 192.168.1.1 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65002 vrf vrf-50
 bgp router-id 10.0.50.1
 no bgp network import-check
 address-family ipv4 unicast
  network 10.0.50.1/32
 exit-address-family
 address-family l2vpn evpn
  rd 65002:50
  route-target both 65002:50
  advertise ipv4 unicast
 exit-address-family
!
router bgp 65002 vrf vrf-1001
 bgp router-id 10.0.100.1
 no bgp network import-check
 address-family ipv4 unicast
  network 10.0.100.1/32
 exit-address-family
 address-family l2vpn evpn
  rd 65002:1001
  route-target both 65002:1001
  advertise ipv4 unicast
 exit-address-family
!
