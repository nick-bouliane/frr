!
vni 10
!
interface lo
 ip address 10.10.10.1/32
 ip address 198.51.100.1/32
 ip address 198.51.100.2/32
 ip address 198.51.100.3/32
 ip address 198.51.100.4/32
 ip address 198.51.100.5/32
 ip address 198.51.100.6/32
 ip address 198.51.100.7/32
 ip address 198.51.100.8/32
!
interface r1-eth0
 ip address 192.168.1.1/24
!
router bgp 65000
 bgp router-id 10.10.10.1
 no bgp default ipv4-unicast
 neighbor 192.168.1.101 remote-as 65000
 neighbor 192.168.1.101 capability extended-nexthop
 !
 address-family ipv4 unicast
  network 198.51.100.1/32
  network 198.51.100.2/32
  network 198.51.100.3/32
  network 198.51.100.4/32
  network 198.51.100.5/32
  network 198.51.100.6/32
  network 198.51.100.7/32
  network 198.51.100.8/32
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 192.168.1.101 activate
  advertise-all-vni
  advertise ipv4 unicast
 exit-address-family
!