!
route-map FANOUT permit 10
 match nexthop-fanout 20 36
 set metric 0
!
route-map FANOUT permit 20
 set metric 100
!
interface lo
 ip address 192.168.0.101/32
!
interface rr-eth0
 ip address 192.168.1.101/24
!
interface rr-eth1
 ip address 192.168.2.101/24
!
router bgp 65000
 bgp router-id 192.168.0.101
 no bgp default ipv4-unicast
 bgp route-reflector allow-outbound-policy
 neighbor 192.168.1.1 remote-as 65000
 neighbor 192.168.1.1 capability extended-nexthop
 neighbor 192.168.2.2 remote-as 65000
 neighbor 192.168.2.2 capability extended-nexthop
 !
 address-family l2vpn evpn
  neighbor 192.168.1.1 activate
  neighbor 192.168.1.1 route-reflector-client
  neighbor 192.168.2.2 activate
  neighbor 192.168.2.2 route-reflector-client
  neighbor 192.168.2.2 route-map FANOUT out
 exit-address-family
!